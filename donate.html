<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawTect - Donate</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown:  { DEFAULT:"#A0522D", dark:"#6E3419", light:"#C68642" },
            cream:  { DEFAULT:"#F5F5DC", card:"#F8F7EE" },
            peach:  { DEFAULT:"#F4A460", light:"#FDF0E2" },
            coral:  { DEFAULT:"#E35336", light:"#FCE8E6" },
            bdr:    "#E2DAC8",
            navactive: "#D68B4F",
          },
          fontFamily: { sans:["'Plus Jakarta Sans'","sans-serif"], hand:["'Caveat'","cursive"] },
        }
      }
    }
  </script>
</head>
<body class="bg-cream text-brown-dark min-h-screen">
  <!-- NAVBAR -->
  <header class="bg-brown sticky top-0 z-50 shadow-md">
    <div class="max-w-screen-xl mx-auto flex items-center justify-between px-4 h-16">
      <!-- Left: Logo -->
      <div class="flex items-center gap-3 shrink-0">
        <div class="w-11.5 h-11.5 rounded-full"><img src="Assets/PawTectLogo.svg" alt="PawTect Logo" class="w-12 h-12 object-contain" /></div>
        <span class="text-white text-2xl font-bold italic tracking-wide" style="font-family: 'Caveat', cursive;">PawTect</span>
      </div>
      <nav class="hidden md:flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="map.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-map-location-dot"></i><span>Map</span></a>
        <a href="rescue-cases.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-list-check"></i><span>Rescue Cases</span></a>
        <a href="submit-report.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-bullhorn"></i><span>Report</span></a>
        <a href="donate.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white bg-navactive transition-colors"><i class="fa-solid fa-heart"></i><span>Donate</span></a>
        <a href="profile.html" class="flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition-colors"><i class="fa-solid fa-user"></i><span>Profile</span></a>
      </nav>
      <div class="flex md:hidden items-center">
        <button class="text-white text-2xl px-2" onclick="toggleMobileNav()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
    <nav id="mobileNav" class="hidden md:hidden bg-brown border-t border-white/20 px-4 pb-4 pt-2 flex flex-col gap-1">
        <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold hover:bg-white/10 rounded-lg"><i class="fa-solid fa-house w-5 text-center"></i>Home</a>
        <a href="map.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold hover:bg-white/10 rounded-lg"><i class="fa-solid fa-map-location-dot w-5 text-center"></i>Map</a>
        <a href="rescue-cases.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold hover:bg-white/10 rounded-lg"><i class="fa-solid fa-list-check w-5 text-center"></i>Rescue Cases</a>
        <a href="submit-report.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold hover:bg-white/10 rounded-lg"><i class="fa-solid fa-bullhorn w-5 text-center"></i>Report</a>
        <a href="donate.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold bg-navactive rounded-lg"><i class="fa-solid fa-heart w-5 text-center"></i>Donate</a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-white font-bold hover:bg-white/10 rounded-lg"><i class="fa-solid fa-user w-5 text-center"></i>Profile</a>
    </nav>
  </header>

  <!-- MAIN CONTENT (Same as your original) -->
  <div class="max-w-screen-xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-6">
    <main class="min-w-0">
      <div class="flex items-center gap-3 mb-5">
        <i class="fa-solid fa-heart text-2xl text-coral"></i>
        <h2 class="text-xl font-extrabold">Donate</h2>
      </div>
      <div class="bg-cream-card border border-bdr rounded-xl p-5 sm:p-6">
        <form onsubmit="handleDonationSubmit(event)">
          <p class="text-sm text-gray-600 mb-5">Your donation helps provide food, medical care, and shelter for rescued animals. Every peso counts!</p>
          <div class="mb-5">
            <label class="text-sm font-bold mb-2 block">Donation Amount (₱)</label>
            <div class="relative mb-2">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-brown">₱</span>
              <input type="number" id="donationAmount" required min="1" placeholder="0.00" class="w-full pl-10 pr-4 py-3 border border-brown-dark rounded-xl bg-transparent text-sm outline-none font-sans" />
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="setAmount(50)"  class="border border-peach px-4 py-1.5 rounded-lg text-sm font-bold bg-white hover:bg-peach hover:text-white transition">₱50</button>
              <button type="button" onclick="setAmount(100)" class="border border-peach px-4 py-1.5 rounded-lg text-sm font-bold bg-white hover:bg-peach hover:text-white transition">₱100</button>
              <button type="button" onclick="setAmount(250)" class="border border-peach px-4 py-1.5 rounded-lg text-sm font-bold bg-white hover:bg-peach hover:text-white transition">₱250</button>
              <button type="button" onclick="setAmount(500)" class="border border-peach px-4 py-1.5 rounded-lg text-sm font-bold bg-white hover:bg-peach hover:text-white transition">₱500</button>
            </div>
          </div>
          <div class="mb-4">
            <label class="text-sm font-bold mb-1 block">Full Name</label>
            <input type="text" required placeholder="Your full name" class="w-full px-4 py-3 border border-bdr rounded-xl bg-transparent text-sm outline-none font-sans" />
          </div>
          <div class="mb-4">
            <label class="text-sm font-bold mb-1 block">Payment Method</label>
            <select class="w-full px-4 py-3 border border-bdr rounded-xl bg-transparent text-sm outline-none font-sans" required>
              <option value="" disabled selected>Select payment method</option>
              <option>GCash</option><option>Maya</option><option>Bank Transfer</option><option>Credit / Debit Card</option>
            </select>
          </div>
          <div class="mb-5">
            <label class="text-sm font-bold mb-1 block">Upload Receipt / Proof of Payment</label>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-5 text-center cursor-pointer hover:border-peach transition" onclick="document.getElementById('receiptInput').click()">
              <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 mb-1"></i>
              <p class="text-xs text-gray-500">Click to upload receipt</p>
              <p id="filePreview" class="text-xs text-brown mt-1 font-semibold"></p>
              <input type="file" id="receiptInput" accept="image/*,.pdf" hidden onchange="handleFileSelect(event)" />
            </div>
          </div>
          <div class="flex justify-end gap-3 pt-2 border-t border-bdr flex-wrap">
            <a href="index.html" class="border border-brown-dark text-brown-dark font-bold px-4 py-2 rounded-lg text-sm">Cancel</a>
            <button type="submit" class="flex items-center gap-2 bg-coral text-white font-bold px-5 py-2 rounded-lg text-sm">
              <i class="fa-solid fa-heart"></i> Donate Now
            </button>
          </div>
        </form>
      </div>
    </main>
    <aside class="flex flex-col gap-4">
      <div class="bg-cream-card border border-bdr rounded-xl px-4 py-3 flex justify-between items-center font-extrabold text-sm">
        <span>Notification</span><i class="fa-solid fa-bell text-brown"></i>
      </div>
    </aside>
  </div>
  <script src="script.js"></script>
</body>
</html>
